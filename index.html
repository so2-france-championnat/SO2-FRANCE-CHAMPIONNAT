<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Valhalla Tournament</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<div class="bg"></div>
<div class="overlay"></div>

<header class="header">

  <div class="brand">
    <img src="logo.jpg" class="logo">
    <div class="title">Valhalla Tournament</div>
  </div>

  <div class="live">● SEASON 1</div>

</header>

<!-- =========================
       RÉSEAUX SOCIAUX DMBDR
========================= -->

<div class="dmbdr-social">

  <div class="dmbdr-social-title">
    RÉSEAUX SOCIAUX DMBDR
  </div>

  <div class="social">

    <button class="discord"
            onclick="window.open('https://discord.gg/X2VwYnepAr', '_blank')">
      Discord
    </button>

    <button class="twitch"
            onclick="window.open('https://m.twitch.tv/so2francechampionnat/home', '_blank')">
      Twitch
    </button>

    <button class="youtube"
            onclick="window.open('https://m.youtube.com/channel/UCypbT6QGPC0oARGa3n1XbRQ?ra=m', '_blank')">
      YouTube
    </button>

  </div>


<!-- NAVIGATION -->
<nav class="nav">
  <button onclick="show('home')">Home</button>
  <button onclick="show('teams')">Teams</button>
  <button onclick="show('players')">Players</button>
  <button onclick="show('matches')">Matches</button>
  <button onclick="show('ranking')">Rankings</button>
</nav>

<!-- =========================
            HOME
========================= -->

<section id="home" class="page active">

  <div class="grid">

    <div class="card clickable" onclick="show('teams')">
      👥 Teams
      <h2>8</h2>
    </div>

    <div class="card clickable" onclick="show('players')">
      👤 Players
      <h2>20</h2>
    </div>

    <div class="card clickable" onclick="show('matches')">
      ⚔️ Matches
    </div>

    <div class="card clickable" onclick="show('ranking')">
      🏆 Rankings
    </div>

  </div>

<!-- RÉSEAUX SOCIAUX VALHALLA -->
<div class="valhalla-social">

  <div class="valhalla-social-title">
    RÉSEAUX SOCIAUX VALHALLA
  </div>

  <div class="valhalla-social-buttons">

    <button class="valhalla-discord"
            onclick="window.open('https://discord.gg/pdvvzVtEs', '_blank')">
      💬 Discord
    </button>

    <button class="valhalla-youtube"
            onclick="window.open('https://youtube.com/@valhalla95800?si=ofFfk6nIFL1GKNzY', '_blank')">
      ▶️ YouTube
    </button>

  </div>

</div>
  
  <!-- IMAGE INTERNATIONALE -->
  <div class="home-banner">

  <img src="international.jpg" 
       class="international-img"
       alt="SO2 International Championship">

  <img src="dmbdr-credit.jpg"
       class="dmbdr-credit"
       alt="Site fourni par DMBDR Championship">

</div>

</section>

<!-- =========================
            TEAMS
========================= -->

<section id="teams" class="page">

  <h2>Teams</h2>

  <div id="teamList"></div>

</section>

<!-- =========================
            PLAYERS
========================= -->

<section id="players" class="page">

  <h2>Players</h2>

  <div class="player-nav">

    <button onclick="renderPlayers()">
      Leaderboard
    </button>

    <button onclick="renderStatsMenu()">
      Stats
    </button>

  </div>

  <!-- LEADERBOARD -->
  <div id="playerList"></div>

  <!-- STATS -->
  <div id="playerStats"></div>

</section>

<!-- =========================
            MATCHES
========================= -->

<section id="matches" class="page">

  <h2>Matches</h2>

  <div id="matchList"></div>

</section>

<!-- =========================
            RANKINGS
========================= -->

<section id="ranking" class="page">

  <h2>Team Rankings</h2>

  <div id="rankingList"></div>

</section>

<script src="script.js"></script>

</body>
</html>
